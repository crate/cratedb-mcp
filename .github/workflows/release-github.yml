# Create the GitHub release for a pushed release tag.
# The notes are the tag's section of CHANGES.md, followed by the notes GitHub generates.
name: "Release: GitHub"

on:
  push:
    tags:
      - '*.*.*'

jobs:
  release:
    name: "Create GitHub release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:

      - name: Acquire sources
        uses: actions/checkout@v7

      - name: Create release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "Release ${tag} exists already, leaving it as it is"
            exit 0
          fi

          heading="## v${tag#v} - "
          {
            echo "## Changes"
            echo
            awk -v heading="${heading}" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## /         { exit }
              found && !body && /^[[:space:]]*$/ { next }
              found                   { body = 1; print }
            ' CHANGES.md
          } > notes.md

          if [ "$(wc -l < notes.md)" -le 2 ]; then
            echo "CHANGES.md has no section '${heading}...' with content for ${tag}"
            exit 1
          fi

          gh release create "${tag}" --verify-tag --title "${tag}" --notes-file notes.md --generate-notes
