# Publish the server to the MCP Registry, https://registry.modelcontextprotocol.io/.
# The registry verifies the PyPI package and the OCI image at publish time,
# so this waits until the release workflows have published both.
name: "Release: MCP Registry"

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: "Publish to MCP Registry"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9

    steps:

      - name: Acquire sources
        uses: actions/checkout@v7

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          jq --arg v "${VERSION}" '
            .version = $v
            | (.packages[] | select(.registryType == "pypi")).version = $v
            | (.packages[] | select(.registryType == "oci")).identifier = "ghcr.io/crate/cratedb-mcp:" + $v
          ' server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Wait for PyPI package and OCI image
        run: |
          for attempt in $(seq 1 60); do
            pypi=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/cratedb-mcp/${VERSION}/json")
            if [ "${pypi}" = "200" ] && docker manifest inspect "ghcr.io/crate/cratedb-mcp:${VERSION}" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "PyPI package or OCI image ${VERSION} did not appear within 30 minutes"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "${archive}" "${base_url}/${archive}"
          curl --fail --location --silent --show-error --output "${archive}.sigstore.json" "${base_url}/${archive}.sigstore.json"
          cosign verify-blob \
            --bundle "${archive}.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${archive}"
          tar xzf "${archive}" mcp-publisher
          rm -f "${archive}" "${archive}.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
